{% load static %}
<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZAMETKI SUN</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="{% static 'mainapp/css/style.css' %}" />
    <link rel="stylesheet" href="{% static 'mainapp/css/dark.css' %}" />
    <link rel="stylesheet" href="{% static 'mainapp/css/mobile.css' %}" />
    
    <script src="{% static 'mainapp/js/dark.js' %}" defer></script>
  </head>
  <body>
    <header>
      <div class="container">
        <div class="d-flex justify-content-between">
          <a href="{% url 'index' %}" class="text-dark text-decoration-none"
            >ZAMETKI SUN</a
          >
          <button type="button" class="theme" aria-label="Сменить тему" 
              data-sun="{% static 'mainapp/img/sun.svg' %}" 
              data-moon="{% static 'mainapp/img/moon.svg' %}">
              <img src="{% static 'mainapp/img/moon.svg' %}" alt="" />
          </button>
      </div>
    </header>
    <main>
      <div class="container">
        <div class="hero">
          <div class="d-flex flex-column gap-4">
            <h1>Ваши заметки<br />всегда под рукой</h1>
            <p>
              Создавайте, храните и находите важные заметки<br />в одном месте
            </p>
          </div>
          <div>
            {% if user.is_authenticated %}
              <a href="{% url 'notes' %}" class="brdn">Мои заметки</a>
            {% else %}
              <a href="{% url 'login' %}" class="brdn">Войти</a>
            {% endif %}
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
